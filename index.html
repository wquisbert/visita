<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Casa del Trabajador en Salud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-red-950 via-gray-900 to-emerald-950 flex items-center justify-center min-h-screen p-4 md:p-8 font-sans">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden border border-gray-200">
        
        <div class="bg-gradient-to-r from-red-950 to-red-800 px-6 py-8 md:px-10 md:py-10 text-center relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-600 to-emerald-400"></div>
            
            <h2 class="text-yellow-500 text-sm md:text-base font-bold uppercase tracking-widest mb-2 drop-shadow-md">
                Formulario de Registro de Visitas
            </h2>
            <h1 class="text-white text-base md:text-lg font-bold uppercase leading-snug tracking-wide">
                Registro de Participantes a la Visita de la <br> 
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 text-xl md:text-2xl block mt-1 mb-1 drop-shadow-sm">
                    Casa del Trabajador en Salud
                </span>
                Departamento de La Paz
            </h1>
            
            <div class="mt-6 inline-block border border-yellow-500/50 rounded-lg px-6 py-2 bg-black/30 backdrop-blur-sm shadow-inner">
                <p class="text-gray-100 text-xs md:text-sm font-semibold tracking-widest uppercase">
                    FECHA DE VISITA: SÁBADO 11 DE SEPTIEMBRE, HORAS 11:00 AM
                </p>
            </div>
        </div>
        
        <form id="registroForm" class="p-6 md:p-10 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Número de Carnet -->
                <div class="md:col-span-2">
                    <label for="ci" class="block text-xs md:text-sm font-bold text-gray-700 uppercase tracking-wide">Número de Carnet</label>
                    <input type="text" id="ci" name="ci" required autocomplete="off"
                        class="mt-2 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-700 focus:border-emerald-700 outline-none uppercase transition-all shadow-sm font-medium"
                        oninput="this.value = this.value.toUpperCase()">
                </div>

                <!-- Apellido Paterno -->
                <div>
                    <label for="paterno" class="block text-xs md:text-sm font-bold text-gray-700 uppercase tracking-wide">Apellido Paterno</label>
                    <input type="text" id="paterno" name="paterno" required autocomplete="off"
                        class="mt-2 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 focus:border-red-800 outline-none uppercase transition-all shadow-sm font-medium"
                        oninput="this.value = this.value.toUpperCase()">
                </div>

                <!-- Apellido Materno -->
                <div>
                    <label for="materno" class="block text-xs md:text-sm font-bold text-gray-700 uppercase tracking-wide">Apellido Materno</label>
                    <input type="text" id="materno" name="materno" required autocomplete="off"
                        class="mt-2 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-800 focus:border-red-800 outline-none uppercase transition-all shadow-sm font-medium"
                        oninput="this.value = this.value.toUpperCase()">
                </div>

                <!-- Nombres -->
                <div class="md:col-span-2">
                    <label for="nombres" class="block text-xs md:text-sm font-bold text-gray-700 uppercase tracking-wide">Nombres</label>
                    <input type="text" id="nombres" name="nombres" required autocomplete="off"
                        class="mt-2 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-700 focus:border-emerald-700 outline-none uppercase transition-all shadow-sm font-medium"
                        oninput="this.value = this.value.toUpperCase()">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-emerald-900 to-emerald-700 hover:from-emerald-950 hover:to-emerald-800 text-white font-bold py-4 px-6 rounded-lg uppercase tracking-widest transition-all duration-300 shadow-[0_10px_20px_rgba(4,120,87,0.3)] hover:shadow-[0_10px_25px_rgba(4,120,87,0.5)] transform hover:-translate-y-1">
                    Registrar Datos
                </button>
            </div>
        </form>

        <div class="bg-gradient-to-r from-red-950 to-red-900 px-6 py-4 rounded-b-2xl border-t border-red-800">
            <p class="text-center text-xs font-bold text-gray-300 uppercase tracking-widest leading-relaxed">
                REGISTRO: SINDICATO DE TRABAJADORES EN SALUD DE SEDES LA PAZ 2026
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registroForm');
        
        // ¡RECUERDA PEGAR AQUÍ TU NUEVA URL DE APPS SCRIPT!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx6yiEb8LvW87iTGoy6fbitzgYBO3Muk6B3tq2AE-rG1m1Mjhh4uicaoVOkMVIP51k/exec'; 

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const dataObj = Object.fromEntries(formData.entries());

            Swal.fire({
                title: 'VERIFICACIÓN DE DATOS',
                html: `
                    <div class="text-left space-y-3 mt-4 text-gray-800 bg-gray-50 p-4 border border-gray-200 rounded-lg shadow-inner">
                        <p class="border-b border-gray-200 pb-2"><strong class="text-emerald-800">CI:</strong> <span class="font-bold">${dataObj.ci}</span></p>
                        <p class="border-b border-gray-200 pb-2"><strong class="text-red-900">PATERNO:</strong> <span class="font-bold">${dataObj.paterno}</span></p>
                        <p class="border-b border-gray-200 pb-2"><strong class="text-red-900">MATERNO:</strong> <span class="font-bold">${dataObj.materno}</span></p>
                        <p><strong class="text-emerald-800">NOMBRES:</strong> <span class="font-bold">${dataObj.nombres}</span></p>
                    </div>
                    <p class="mt-4 text-sm text-gray-600 font-bold uppercase tracking-wide">¿Confirma que la información es correcta?</p>
                `,
                icon: 'question',
                iconColor: '#047857', 
                showCancelButton: true,
                confirmButtonColor: '#047857',
                cancelButtonColor: '#991b1b',
                confirmButtonText: 'SÍ, REGISTRAR',
                cancelButtonText: 'CANCELAR',
                customClass: {
                    title: 'text-xl font-bold uppercase text-gray-900',
                    popup: 'rounded-2xl border-t-4 border-emerald-700 shadow-2xl'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    
                    Swal.fire({
                        title: 'PROCESANDO...',
                        text: 'Verificando y guardando registro.',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    fetch(scriptURL, { 
                        method: 'POST', 
                        body: new URLSearchParams(formData) 
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('Error en la respuesta de red');
                        return response.json();
                    })
                    .then(data => {
                        
                        if (data.resultado === 'duplicado') {
                            // NUEVO MENSAJE DE DUPLICADO MEJORADO
                            Swal.fire({
                                title: 'PARTICIPANTE YA REGISTRADO',
                                html: `
                                    <div class="mt-4 text-gray-700 bg-red-50 p-4 rounded-lg border border-red-200 shadow-inner">
                                        El número de carnet <strong class="text-red-900 text-xl block mt-2">${dataObj.ci}</strong>
                                    </div>
                                    <p class="mt-4 font-bold text-gray-800 uppercase tracking-wide text-sm">Ya cuenta con un registro activo para esta visita.</p>
                                `,
                                icon: 'warning',
                                iconColor: '#991b1b',
                                confirmButtonColor: '#991b1b',
                                confirmButtonText: 'ENTENDIDO',
                                customClass: {
                                    title: 'text-xl font-bold uppercase text-red-900',
                                    popup: 'rounded-2xl border-t-4 border-red-800 shadow-2xl'
                                }
                            });
                        } else if (data.resultado === 'exito') {
                            Swal.fire({
                                title: '¡REGISTRO EXITOSO!',
                                text: 'El participante ha sido registrado correctamente.',
                                icon: 'success',
                                iconColor: '#047857',
                                confirmButtonColor: '#047857',
                                confirmButtonText: 'ACEPTAR',
                                customClass: {
                                    popup: 'rounded-2xl border-t-4 border-emerald-700 shadow-2xl'
                                }
                            });
                            form.reset(); 
                        } else {
                            throw new Error('Respuesta inesperada del servidor');
                        }
                        
                    })
                    .catch(error => {
                        console.error('Error!', error);
                        Swal.fire({
                            title: 'ERROR DE CONEXIÓN',
                            text: 'No se pudo guardar el registro. Verifique la conexión.',
                            icon: 'error',
                            iconColor: '#991b1b',
                            confirmButtonColor: '#991b1b',
                            confirmButtonText: 'CERRAR',
                            customClass: {
                                popup: 'rounded-2xl border-t-4 border-red-800 shadow-2xl'
                            }
                        });
                    });
                }
            });
        });
    </script>
</body>
</html>
